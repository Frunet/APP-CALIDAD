name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # La URL y la clave publicable de Supabase son públicas por diseño (van en el navegador);
      # la seguridad la dan las políticas RLS de la base de datos.
      VITE_SUPABASE_URL: https://wyivnmbzffegkvsskjpq.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_J_8Ict45r8cg5oafQ8_8aQ_DlEixnWF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx vite build --base=/APP-CALIDAD/
      # Las rutas de la SPA (p. ej. /receptions/123) se resuelven con el 404.html de Pages.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
